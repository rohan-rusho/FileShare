<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#26c6da;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097a7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-color="#004d54" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#cloudGradient)" stroke="#006064" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Server/Cloud storage representation -->
  <!-- Main cloud shape -->
  <path d="M23.5 18.5c1 0 1.8-.8 1.8-1.8s-.8-1.8-1.8-1.8c-.15 0-.28.02-.41.06C22.9 13.6 21.7 13 20.2 13c-1.2 0-2.2.45-2.9 1.2C16.8 13.4 16.1 13 15.3 13c-1.4 0-2.5 1.1-2.5 2.5 0 .3.05.55.14.8H12.5c-1.4 0-2.5 1.1-2.5 2.5s1.1 2.5 2.5 2.5h11c1 0 1.8-.8 1.8-1.8s-.8-1.7-1.8-1.7z" fill="white" opacity="0.95"/>
  
  <!-- File icons inside cloud -->
  <rect x="13" y="16.5" width="2" height="2.5" fill="#0097a7" rx="0.2" opacity="0.8"/>
  <rect x="15.5" y="16" width="2" height="3" fill="#00acc1" rx="0.2" opacity="0.8"/>
  <rect x="18" y="16.8" width="2" height="2.2" fill="#26c6da" rx="0.2" opacity="0.8"/>
  
  <!-- Upload arrow -->
  <g opacity="0.9">
    <path d="M16 10v7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M13.5 12.5l2.5-2.5 2.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Small dots for additional detail -->
  <circle cx="21" cy="19.5" r="0.5" fill="white" opacity="0.6"/>
  <circle cx="22.5" cy="18.8" r="0.3" fill="white" opacity="0.4"/>
</svg>
