<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Forgot Password - Personal File Server</title>
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div id="app">
        <!-- Authentication Container -->
        <div id="auth-container" class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">
                        <i class="fas fa-cloud-upload-alt"></i>
                        Personal File Server
                    </h1>
                    <p class="auth-subtitle">Test Forgot Password Feature</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-username" class="form-label">Username</label>
                        <input type="text" id="login-username" class="form-input" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="auth-button">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                    <div class="auth-links">
                        <a href="#" id="forgot-password-link" class="forgot-password-link">
                            <i class="fas fa-key"></i>
                            Forgot Password?
                        </a>
                    </div>
                </form>

                <!-- Forgot Password Form -->
                <form id="forgot-password-form" class="auth-form hidden">
                    <div class="forgot-password-header">
                        <h2 class="forgot-password-title">
                            <i class="fas fa-key"></i>
                            Reset Password
                        </h2>
                        <p class="forgot-password-subtitle">Enter your username to receive a password reset email</p>
                    </div>
                    <div class="form-group">
                        <label for="reset-username" class="form-label">Username</label>
                        <input type="text" id="reset-username" class="form-input" placeholder="Enter your username" required>
                    </div>
                    <button type="submit" class="auth-button">
                        <i class="fas fa-paper-plane"></i>
                        Send Reset Email
                    </button>
                    <div class="auth-links">
                        <a href="#" id="back-to-login-link" class="back-to-login-link">
                            <i class="fas fa-arrow-left"></i>
                            Back to Login
                        </a>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="register-username" class="form-label">Username</label>
                        <input type="text" id="register-username" class="form-input" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-name" class="form-label">Your Name</label>
                        <input type="text" id="register-name" class="form-input" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password" id="register-password" class="form-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" id="register-confirm-password" class="form-input" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="auth-button">
                        <i class="fas fa-user-plus"></i>
                        Sign Up
                    </button>
                </form>

                <div class="auth-switch">
                    <p id="auth-switch-text">Don't have an account? <a href="#" id="auth-switch-link">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        // Simple test script for UI functionality
        console.log('Test script loaded');

        // DOM elements
        const loginForm = document.getElementById('login-form');
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const registerForm = document.getElementById('register-form');
        const authSwitchLink = document.getElementById('auth-switch-link');
        const authSwitchText = document.getElementById('auth-switch-text');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const backToLoginLink = document.getElementById('back-to-login-link');

        // Show toast function
        const showToast = (message, type = 'info') => {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = type === 'success' ? 'fas fa-check-circle' :
                type === 'error' ? 'fas fa-exclamation-circle' :
                    type === 'warning' ? 'fas fa-exclamation-triangle' :
                        'fas fa-info-circle';

            toast.innerHTML = `
                <i class="toast-icon ${icon}"></i>
                <span class="toast-message">${message}</span>
            `;

            toastContainer.appendChild(toast);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        };

        // Form switching functions
        const showForgotPasswordForm = () => {
            console.log('Showing forgot password form');
            loginForm.classList.add('hidden');
            registerForm.classList.add('hidden');
            forgotPasswordForm.classList.remove('hidden');
            authSwitchText.style.display = 'none';
        };

        const showLoginForm = () => {
            console.log('Showing login form');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            forgotPasswordForm.classList.add('hidden');
            authSwitchText.style.display = 'block';
            authSwitchText.innerHTML = 'Don\'t have an account? <a href="#" id="auth-switch-link">Sign up</a>';
            
            // Re-attach event listener
            setTimeout(() => {
                const newAuthSwitchLink = document.getElementById('auth-switch-link');
                if (newAuthSwitchLink) {
                    newAuthSwitchLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        toggleAuthMode();
                    });
                }
            }, 100);
        };

        const toggleAuthMode = () => {
            const isLoginMode = !loginForm.classList.contains('hidden');
            
            if (isLoginMode) {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                authSwitchText.innerHTML = 'Already have an account? <a href="#" id="auth-switch-link">Sign in</a>';
            } else {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                authSwitchText.innerHTML = 'Don\'t have an account? <a href="#" id="auth-switch-link">Sign up</a>';
            }

            // Re-attach event listener
            setTimeout(() => {
                const newAuthSwitchLink = document.getElementById('auth-switch-link');
                if (newAuthSwitchLink) {
                    newAuthSwitchLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        toggleAuthMode();
                    });
                }
            }, 100);
        };

        // Event handlers
        const handleForgotPassword = (e) => {
            e.preventDefault();
            const username = document.getElementById('reset-username').value;
            
            if (!username) {
                showToast('Please enter your username', 'error');
                return;
            }

            showToast('Password reset functionality would send email to: ' + username + '@fileserver.local', 'info');
            showToast('This is a test mode - Firebase integration needed for actual email sending', 'warning');
            
            // Clear form and return to login after demo
            setTimeout(() => {
                document.getElementById('reset-username').value = '';
                showLoginForm();
                showToast('Demo complete - returned to login form', 'success');
            }, 3000);
        };

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Setting up test event listeners');

            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showForgotPasswordForm();
                });
            }

            if (backToLoginLink) {
                backToLoginLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showLoginForm();
                });
            }

            if (forgotPasswordForm) {
                forgotPasswordForm.addEventListener('submit', handleForgotPassword);
            }

            if (authSwitchLink) {
                authSwitchLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleAuthMode();
                });
            }

            // Form submissions (demo mode)
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    showToast('Login demo - Firebase authentication needed for actual login', 'info');
                });
            }

            if (registerForm) {
                registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    showToast('Register demo - Firebase authentication needed for actual registration', 'info');
                });
            }

            console.log('Test setup complete!');
            showToast('Test page loaded successfully! Try the "Forgot Password?" link.', 'success');
        });
    </script>
</body>
</html>
